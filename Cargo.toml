[package]
name = "cactagent"
version = "0.6.0"
edition = "2021"
authors = ["Azmi Şahin <azmisahin@outlook.com>"]
description = "A fully local AI agent contained in a single binary."
license = "AGPL-3.0"
repository = "https://github.com/azmisahin-ai/cactagent"
keywords = ["ai", "agent", "llm", "local", "rust"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "cactagent"
path = "src/main.rs"

[dependencies]
needle-infer = "0.2.1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde_json = "1"
urlencoding = "2"
scraper = "0.22"
readability = "0.3"
url = "2"
hf-hub = "0.5"

[profile.release]
opt-level = "z"        # Boyut için optimize et (hız yerine)
lto = true             # Link-time optimization
codegen-units = 1      # Daha iyi optimizasyon
strip = true           # Sembolleri kaldır
panic = "abort"        # Panic yerine abort (daha küçük binary)